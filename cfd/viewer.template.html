<div id="oven-cfd-viewer" aria-label="Viewer geometrico CFD del forno">
  <style>
    #oven-cfd-viewer { color: var(--foreground); font-size: var(--font-size-base); }
    #oven-cfd-viewer .viewer-head { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
    #oven-cfd-viewer .viewer-stage { padding: 8px; margin-top: 8px; }
    #oven-cfd-viewer canvas { display:block; width:100%; height:auto; touch-action:none; background:var(--muted); }
    #oven-cfd-viewer .viewer-meta { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-top:8px; }
    #oven-cfd-viewer .viewer-legend { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    #oven-cfd-viewer .swatch { display:inline-block; width:11px; height:11px; margin-right:4px; vertical-align:-1px; }
    #oven-cfd-viewer .heatbar { width:100px; height:10px; background:linear-gradient(90deg, var(--blue), var(--yellow), var(--red)); }
    #oven-cfd-viewer .viewer-note { margin-top:8px; min-height:2.4em; }
    #oven-cfd-viewer .viewer-status { font-weight:500; }
    #oven-cfd-viewer .viewer-controls { margin-top:8px; }
    #oven-cfd-viewer .range-wrap { min-width:150px; }
    @media (max-width: 440px) { #oven-cfd-viewer .range-wrap { width:100%; } }
  </style>
  <div class="viewer-head">
    <h3>Geometria interna e sezioni CFD</h3>
    <span id="ov-status" class="viewer-status text-muted" aria-live="polite"></span>
  </div>
  <div class="viz-controls viewer-controls">
    <label class="form-label">Configurazione
      <select id="ov-case" class="form-select" aria-label="Configurazione forno"></select>
    </label>
    <label class="form-label">Canna
      <select id="ov-flue" class="form-select" aria-label="Variante canna"><option value="front">Frontale</option><option value="central">Centrale</option></select>
    </label>
    <label class="form-check form-switch"><input id="ov-roof" class="form-check-input" type="checkbox" checked><span class="form-check-label">Volta trasparente</span></label>
    <label class="form-check form-switch"><input id="ov-rotate" class="form-check-input" type="checkbox"><span class="form-check-label">Meccanica 2 giri/min</span></label>
    <label class="form-label">Campo sul piano
      <select id="ov-field" class="form-select" aria-label="Campo CFD da visualizzare"><option value="none">Solo geometria</option><option value="temperature">Temperatura</option><option value="flow">Velocità</option></select>
    </label>
    <label class="form-check form-switch"><input id="ov-fullchimney" class="form-check-input" type="checkbox"><span class="form-check-label">Camino intero</span></label>
    <label class="form-check form-switch"><input id="ov-top" class="form-check-input" type="checkbox"><span class="form-check-label">Vista dall’alto</span></label>
    <label class="form-label range-wrap">Inclinazione vista <span id="ov-elev-value" class="tabular-nums">24°</span>
      <input id="ov-elev" class="form-range" type="range" min="12" max="48" value="24">
    </label>
  </div>
  <div class="card viewer-stage">
    <canvas id="ov-canvas" role="img" aria-label="Modello tridimensionale interattivo del forno. Trascinare per ruotare la vista."></canvas>
    <div class="viewer-meta text-small">
      <div id="ov-dims" class="tabular-nums"></div>
      <div class="viewer-legend"><span><i class="swatch" id="ov-pizza-swatch"></i>Pizze Ø30</span><span><i class="swatch" id="ov-fire-swatch"></i>Zona legna</span><span id="ov-heat-legend" hidden><i class="heatbar"></i> 25–1000 °C</span></div>
    </div>
  </div>
  <div id="ov-note" class="viewer-note text-small text-muted" aria-live="polite"></div>

    [[roofToggle,'roof'],[rotationToggle,'rotate'],[fullChimneyToggle,'fullChimney'],[topToggle,'top']].forEach(([e,k])=>e.addEventListener('change',()=>{state[k]=e.checked;refreshInfo();if(k==='rotate')maybeAnimate();persist();})); fieldSelect.addEventListener('change',()=>{state.field=fieldSelect.value;refreshInfo();persist();});

    canvas.addEventListener('pointerdown',e=>{state.dragging=true;state.px=e.clientX;state.py=e.clientY;canvas.setPointerCapture(e.pointerId);}); canvas.addEventListener('pointermove',e=>{if(!state.dragging)return;state.az+=(e.clientX-state.px)*.012;state.el=Math.max(.16,Math.min(1.25,state.el+(e.clientY-state.py)*.008));elev.value=Math.round(state.el*180/Math.PI);elevValue.textContent=`${elev.value}°`;state.px=e.clientX;state.py=e.clientY;draw(current());}); canvas.addEventListener('pointerup',e=>{state.dragging=false;try{canvas.releasePointerCapture(e.pointerId);}catch(_){ }persist();});
    const reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)'); let animating=false;
    const tick=t=>{if(!(state.rotate&&current()?.rotating)||reduceMotion?.matches){animating=false;return;}state.anim=t/1000;draw(current());requestAnimationFrame(tick);};
    const maybeAnimate=()=>{if(!animating&&state.rotate&&current()?.rotating&&!reduceMotion?.matches){animating=true;requestAnimationFrame(tick);}};
    new ResizeObserver(()=>draw(current())).observe(canvas); refreshInfo(); maybeAnimate();
  })();
  </script>

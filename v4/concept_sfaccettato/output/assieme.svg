<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img"><title>C01 / ASSIEME DI INGOMBRO</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="60.000" y="55.000" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#193345" text-anchor="start">C01 / ASSIEME DI INGOMBRO</text>
<text x="60.000" y="88.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Modello geometrico, non render fotorealistico. Camino H1000 rappresentato COMPLETO.</text>
<line x1="60.000" y1="110.000" x2="1340.000" y2="110.000" stroke="#cbd6dc" stroke-width="1.5"/>
<image x="130" y="140" width="1030" height="795" href="data:image/png;base64,"/>
<text x="1100.000" y="200.000" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#23779a" text-anchor="middle">965 × 915</text>
<text x="1100.000" y="236.000" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#607580" text-anchor="middle">corpo: 617 mm</text>
<text x="1100.000" y="270.000" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#9556a1" text-anchor="middle">totale: 1717 mm</text>
<text x="60.000" y="950.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">La posizione anteriore del camino deriva dalla V4: non è la posizione posteriore suggerita dal render estetico.</text>
<line x1="60.000" y1="990.000" x2="1340.000" y2="990.000" stroke="#cbd6dc" stroke-width="1.5"/>
<text x="60.000" y="1017.000" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#607580" text-anchor="start">C01 · STUDIO NON ESECUTIVO · Nessun profilo di taglio, dimensionamento strutturale o validazione termica.</text>
<text x="1340.000" y="1017.000" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#607580" text-anchor="end">Quote in mm</text>

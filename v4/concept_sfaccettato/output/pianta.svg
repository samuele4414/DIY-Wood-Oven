<text x="940.000" y="185.000" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#23779a" text-anchor="start">BASELINE DI STUDIO</text>
<text x="940.000" y="215.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Isolamento corpo: 75 mm</text>
<text x="940.000" y="240.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Acciaio caldo / esterno: 1,5 / 1 mm</text>
<text x="940.000" y="265.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Riserva montaggio: 10 mm</text>
<text x="940.000" y="290.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Piano / dischi: 20 mm</text>
<text x="940.000" y="315.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Fondo focolare: 30 mm</text>
<text x="940.000" y="340.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Vano meccanico netto: 120 mm</text>
<text x="940.000" y="410.000" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#23779a" text-anchor="start">PERCORSO E ACCESSI</text>
<text x="940.000" y="440.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Caricamento legna dal retro.</text>
<text x="940.000" y="465.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Porta interna di riferimento: y = −80.</text>
<text x="940.000" y="490.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Pelle esterna fronte: y = −167,5.</text>
<text x="940.000" y="515.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Centri dischi dalla pelle: 372,5 mm.</text>
<text x="940.000" y="540.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Il tunnel aggiunto richiede prova pala.</text>
<text x="940.000" y="565.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Camino alto: asse (395; 45).</text>
<text x="940.000" y="635.000" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#23779a" text-anchor="start">DA NON CONFONDERE</text>
<text x="940.000" y="665.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Cerchi = dischi, non fori di taglio.</text>
<text x="940.000" y="690.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Viola = spazio ALTO per raccolta fumi.</text>
<text x="940.000" y="715.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Blu tratteggiato = azionamenti sotto.</text>
<text x="940.000" y="740.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Non sono condotti o motori selezionati.</text>
<text x="940.000" y="765.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Porta e botola: dettagli da sviluppare.</text>
<text x="60.000" y="945.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Riferimento: v4/quote_v4.json · origine sul bordo anteriore sinistro del piano, z=0 sulla pietra.</text>

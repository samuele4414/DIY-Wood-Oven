<text x="495.300" y="624.710" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#607580" text-anchor="middle" transform="rotate(-90 495.3 624.71)">120 netto</text>
<line x1="643.641" y1="327.290" x2="657.104" y2="263.955" stroke="#9556a1" stroke-width="2.5"/>
<text x="668.204" y="249.155" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#9556a1" text-anchor="start">87,5 normale</text>
<text x="960.000" y="175.000" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#23779a" text-anchor="start">COME SI COSTRUISCE L&#x27;INVILUPPO</text>
<text x="960.000" y="205.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">1,5 acciaio + 75 isolante</text>
<text x="960.000" y="230.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">+ 10 riserva + 1 rivestimento.</text>
<text x="960.000" y="255.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Distanza misurata NORMALE</text>
<text x="960.000" y="280.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">a ciascuna falda, non verticale.</text>
<text x="960.000" y="305.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Le pieghe non invadono il volume</text>
<text x="960.000" y="330.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">riservato al pacchetto nominale.</text>
<text x="960.000" y="400.000" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#23779a" text-anchor="start">SOTTO IL PIANO</text>
<text x="960.000" y="430.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">20 mm pietra di cottura</text>
<text x="960.000" y="455.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">50 mm pannello: tipo da qualificare</text>
<text x="960.000" y="480.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Carrier / appoggi: da progettare</text>
<text x="960.000" y="505.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">30 mm pietra nel focolare posteriore</text>
<text x="960.000" y="530.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">120 mm vano netto per meccanica</text>
<text x="960.000" y="555.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">25 mm piedini: solo riserva</text>
<text x="960.000" y="625.000" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#23779a" text-anchor="start">LIMITI IMPORTANTI</text>
<text x="960.000" y="655.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">La lana non sostiene le pietre.</text>
<text x="960.000" y="680.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Colonne dei dischi: schema riservato.</text>
<text x="960.000" y="705.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Nessuna verifica di ponti termici.</text>
<text x="960.000" y="730.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">Nessun componente selezionato.</text>
<text x="960.000" y="755.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">80 mm netti NON bastano alle</text>
<text x="960.000" y="780.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">riserve di azionamento attuali.</text>
<text x="60.000" y="940.000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#607580" text-anchor="start">L&#x27;ingombro stimato è più alto del render: 617 mm nello scenario 75/120. Ridurlo richiede riprogettare il pacchetto.</text>
<line x1="60.000" y1="990.000" x2="1340.000" y2="990.000" stroke="#cbd6dc" stroke-width="1.5"/>
<text x="60.000" y="1017.000" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#607580" text-anchor="start">C01 · STUDIO NON ESECUTIVO · Nessun profilo di taglio, dimensionamento strutturale o validazione termica.</text>
<text x="1340.000" y="1017.000" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#607580" text-anchor="end">Quote in mm</text>

<text x="65" y="543" class="small" text-anchor="start"><tspan x="65" dy="0">Piastra catalogo A238 / B306.</tspan><tspan x="65" dy="29">Budget 260 × 328 con margine + cover.</tspan><tspan x="65" dy="29">Ottagono minimo: 415,8 tra facce.</tspan><tspan x="65" dy="29">340 tratteggiato: NON contiene i vertici.</tspan><tspan x="65" dy="29">440 riservati; CAD della piastra da chiedere.</tspan></text>

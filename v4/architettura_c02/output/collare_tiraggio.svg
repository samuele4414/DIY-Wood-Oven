<text x="852" y="623" class="small" text-anchor="start"><tspan x="852" dy="0">Porta aperta: 57,4 kg/h di gas uscenti</tspan><tspan x="852" dy="29">nel modello 1D, NON massa di fumo/CO.</tspan><tspan x="852" dy="29">H della rete: dal colmo caldo al terminale.</tspan><tspan x="852" dy="29">Tubo H1000: utile 955; H500: utile 455.</tspan><tspan x="852" dy="29">Peso e vento al telaio, non alla volta.</tspan><tspan x="852" dy="29">Raccordo, DoP e temperature da qualificare.</tspan></text>
<text x="65" y="760" class="small" text-anchor="start"><tspan x="65" dy="0">Asse V4 mantenuto; base 440: sporgenza frontale 7,5 mm rispetto C01.</tspan><tspan x="65" dy="29">Ottagono: normali facce X/Y e 45°; raccordo/scocca da integrare.</tspan><tspan x="65" dy="29">L&#x27;ingombro completo non è ancora congelato.</tspan></text>

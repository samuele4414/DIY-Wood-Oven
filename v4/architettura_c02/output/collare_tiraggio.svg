<text x="465" y="492" class="small" text-anchor="start"><tspan x="465" dy="0">C01: circa 140,4 tra facce.</tspan><tspan x="465" dy="29">Catalogo 130/25: esterno 180.</tspan><tspan x="465" dy="29">Budget 130/50: esterno 234*.</tspan><tspan x="465" dy="29">Con margine 10 e cover 1:</tspan><tspan x="465" dy="29">richiesti 256* → riserva 260.</tspan><tspan x="465" dy="29">*50: non è il CAD di un prodotto.</tspan></text>

<text x="365" y="867" class="small" text-anchor="middle"><tspan x="365" dy="0">Riserva servizio 300 · tratto non in scala</tspan></text>
<text x="825" y="155" class="label" text-anchor="start"><tspan x="825" dy="0">Mantenuti dalla V4</tspan></text>
<text x="825" y="193" class="note" text-anchor="start"><tspan x="825" dy="0">Dischi e centri originali.</tspan><tspan x="825" dy="29">Focolare posteriore / camino anteriore.</tspan><tspan x="825" dy="29">Nessuno spostamento per far stare il motore.</tspan></text>
<text x="825" y="320" class="label" text-anchor="start" style="fill:#267999"><tspan x="825" dy="0">Riserve inferiori C02</tspan></text>
<text x="825" y="358" class="note" text-anchor="start"><tspan x="825" dy="0">2 × moduli 240 × 180 in pianta.</tspan><tspan x="825" dy="29">Separazione nominale moduli: 130.</tspan><tspan x="825" dy="29">Motore laterale: h70 riservati.</tspan><tspan x="825" dy="29">Cartuccia distinta: h45 riservati.</tspan><tspan x="825" dy="29">Cinghia/giunti: solo nel vano qualificato.</tspan></text>
<text x="825" y="548" class="label" text-anchor="start"><tspan x="825" dy="0">Vano e manutenzione</tspan></text>
<text x="825" y="586" class="note" text-anchor="start"><tspan x="825" dy="0">Proposta: 160 netti, non 120 congelati.</tspan><tspan x="825" dy="29">Riserva parallela: 117; residuo: 43.</tspan><tspan x="825" dy="29">Carter, cavi e fissaggi non disegnati.</tspan><tspan x="825" dy="29">Estrazione senza sollevare il forno:</tspan><tspan x="825" dy="29">sequenza da dimostrare sul banco.</tspan></text>
<rect x="810" y="760" width="525" height="88" fill="#fff1e5" stroke="#c59460" stroke-width="2" opacity="1"/>
<text x="830" y="796" class="small" text-anchor="start"><tspan x="830" dy="0">Questi rettangoli NON selezionano motori</tspan><tspan x="830" dy="29">e NON provano temperatura o accessibilità.</tspan></text>

<text x="875" y="574" class="small" text-anchor="start"><tspan x="875" dy="0">Botola ricarica 300 × 140</tspan><tspan x="875" dy="29">Interferenza con l&#x27;aria</tspan><tspan x="875" dy="29">da verificare</tspan></text>

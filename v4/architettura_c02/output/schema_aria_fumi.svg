<text x="1080" y="709" class="small" text-anchor="start" style="fill:#38775c"><tspan x="1080" dy="0">Presa 90 cm² NETTI*</tspan><tspan x="1080" dy="29">Griglia + condotto chiuso</tspan><tspan x="1080" dy="29">* punto di confronto</tspan></text>
<text x="885" y="806" class="small" text-anchor="start"><tspan x="885" dy="0">Le uscite laterali e la ripartizione</tspan><tspan x="885" dy="29">primaria/secondaria non sono quotate.</tspan><tspan x="885" dy="29">Nessun passaggio aperto ai motori.</tspan></text>
<text x="980" y="171" class="label" text-anchor="start"><tspan x="980" dy="0">Cosa manca per la nuova CFD</tspan></text>
<text x="980" y="209" class="small" text-anchor="start"><tspan x="980" dy="0">Forma tridimensionale reale.</tspan><tspan x="980" dy="29">Perdite di presa e braci.</tspan><tspan x="980" dy="29">Pulizia e tenuta a caldo.</tspan><tspan x="980" dy="29">Aperture frontale/posteriore.</tspan><tspan x="980" dy="29">Verifica vento e temperatura.</tspan></text>
<rect x="960" y="398" width="375" height="155" fill="#fff1e5" stroke="#c59460" stroke-width="2" opacity="1"/>
<text x="980" y="432" class="small" text-anchor="start"><tspan x="980" dy="0">L&#x27;area del passaggio non prova</tspan><tspan x="980" dy="29">captazione né assenza di CO.</tspan><tspan x="980" dy="29">La rete 1D non valida questo schema.</tspan><tspan x="980" dy="29">Nessuna nuova CFD eseguita.</tspan></text>

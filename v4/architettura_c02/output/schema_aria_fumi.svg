<text x="485" y="235" class="small" text-anchor="start"><tspan x="485" dy="0">Camino anteriore, asse V4 mantenuto.</tspan><tspan x="485" dy="29">Collare/supporto da ingrandire.</tspan><tspan x="485" dy="29">Continuità a porta chiusa da verificare.</tspan></text>
<text x="180" y="480" class="small" text-anchor="start" style="fill:#85609c"><tspan x="180" dy="0">Ingresso libero 640 × 30</tspan><tspan x="180" dy="29">Collo rialzato 170 × 90</tspan><tspan x="180" dy="29">Raccordo graduale a Ø130</tspan></text>

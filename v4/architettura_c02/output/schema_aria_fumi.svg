<text x="439" y="772" class="small" text-anchor="middle" style="fill:#267999"><tspan x="439" dy="0">VANO MECCANICO</tspan><tspan x="439" dy="29">Ventilazione distinta da combustione e cenere</tspan></text>
<rect x="880" y="693" width="175" height="50" fill="#e0eee3" stroke="#38775c" stroke-width="2" opacity="1"/>
<path d="M1035 718 H847 V616 H797" fill="none" stroke="#38775c" stroke-width="5" marker-end="url(#arrow-t03)"/>

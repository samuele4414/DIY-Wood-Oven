<text x="845" y="235" class="small" text-anchor="start"><tspan x="845" dy="0">Ripartitore caldo Ø310 candidato.</tspan><tspan x="845" dy="29">Appoggio ampio, niente pietra serrata.</tspan></text>
<text x="845" y="309" class="small" text-anchor="start" style="fill:#b54a36"><tspan x="845" dy="0">Supporti ceramici strutturali qualificati.</tspan><tspan x="845" dy="29">Non tre carichi puntuali sulla pietra.</tspan></text>
<text x="845" y="387" class="small" text-anchor="start"><tspan x="845" dy="0">Carrier: riserva altezza 15, NON lamiera 15.</tspan><tspan x="845" dy="29">Fissaggi e stabilità a caldo da verificare.</tspan></text>
<text x="845" y="477" class="small" text-anchor="start"><tspan x="845" dy="0">Schermo fisso e labirinto ispezionabile.</tspan><tspan x="845" dy="29">Raccoglibriciole separato dalla meccanica.</tspan></text>
<text x="845" y="584" class="small" text-anchor="start"><tspan x="845" dy="0">Carico assiale di scenario: 110,5 N.</tspan><tspan x="845" dy="29">Spinta al bordo: momento 6,4 Nm.</tspan><tspan x="845" dy="29">Misurare coppia sporco/caldo prima del motore.</tspan><tspan x="845" dy="29">Misurare anche il picco dopo spegnimento.</tspan></text>
<rect x="830" y="748" width="510" height="100" fill="#fff1e5" stroke="#c59460" stroke-width="2" opacity="1"/>
<text x="850" y="780" class="small" text-anchor="start"><tspan x="850" dy="0">L&#x27;isolamento non dimostra un vano freddo.</tspan><tspan x="850" dy="29">Aria vano 50 °C: obiettivo, NON misura.</tspan><tspan x="850" dy="29">La portanza e le temperature restano aperte.</tspan></text>

<text x="120" y="726" class="note" text-anchor="start"><tspan x="120" dy="0">* Riserve / candidati, non componenti commerciali.</tspan><tspan x="120" dy="29">Vano netto 160; stack laterale 117; residuo 43.</tspan><tspan x="120" dy="29">Cartuccia prende peso e momento; motore dà coppia.</tspan></text>

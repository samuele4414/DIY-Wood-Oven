<text x="436.0" y="624" class="dim" text-anchor="middle">Vassoio 240</text>
<text x="830" y="160" class="small" text-anchor="start">Interfaccia caldo/freddo z−85: aperta</text>
<text x="830" y="198" class="small" text-anchor="start">Schermo sul cassetto, non sul telaio</text>
<text x="830" y="236" class="small" text-anchor="start">Pulegge / schermo: 3 mm nominali</text>
<text x="830" y="274" class="small" text-anchor="start">Cartuccia separata dal motore</text>
<text x="830" y="312" class="small" text-anchor="start">Cuscinetti: Ø12 × Ø32 × 10</text>
<text x="830" y="350" class="small" text-anchor="start">Centri 25 / punti pressione 43 (ip.)</text>
<text x="830" y="388" class="small" text-anchor="start">Altezza inviluppo 136 / vano 160</text>
<text x="830" y="426" class="small" text-anchor="start">Residuo inferiore 24 mm grezzi</text>
<text x="830" y="464" class="small" text-anchor="start">14 mm oltre riserva di servizio10</text>
<text x="830" y="502" class="small" text-anchor="start">Driver fuori vano: ambiente ≤40 °C</text>
<text x="45" y="720" class="small" text-anchor="start">Percorso carichi da progettare: disco → supporti qualificati → albero/cartucce → telaio → appoggio; non sulla scocca o sull&#x27;isolante.</text>
<text x="45" y="756" class="small" text-anchor="start">L&#x27;interfaccia superiore, il precarico e i dettagli di montaggio restano aperti: nessun albero costruttivo è definito da questa vista.</text>

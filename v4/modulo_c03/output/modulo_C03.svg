<text x="45" y="76" class="small" text-anchor="start">Motore da STEP del fornitore nel modello 3D; qui proiezioni semplificate. Viti, tenute e accoppiamento caldo non disegnati.</text>
<text x="45" y="824" class="small" text-anchor="start">C03 · mm nominali · NON ESECUTIVO · nessuna approvazione termica, strutturale o per produzione</text>

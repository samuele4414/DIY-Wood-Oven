<line x1="267.775" y1="545" x2="942.75" y2="545" stroke="#587b8b" stroke-width="2" stroke-dasharray=""/>
<line x1="267.775" y1="539" x2="267.775" y2="551" stroke="#587b8b" stroke-width="2" stroke-dasharray=""/>

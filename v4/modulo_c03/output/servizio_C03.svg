<text x="45" y="44" class="head" text-anchor="start">Manutenzione frontale — schema condizionato a freddo</text>
<text x="45" y="76" class="small" text-anchor="start">Abbassamento ed estrazione sono una proposta di percorso nel vuoto; telaio, guide e sweep nel forno reale ancora da verificare.</text>
<text x="45" y="824" class="small" text-anchor="start">C03 · mm nominali · NON ESECUTIVO · nessuna approvazione termica, strutturale o per produzione</text>

<text x="398.275" y="153" class="small" text-anchor="middle">Modulo sfilato (abbassato)</text>
<text x="1073.25" y="153" class="small" text-anchor="middle">In quota / abbassato (tratteggio)</text>
<text x="547.125" y="436.0" class="small" text-anchor="start">Fronte: luce 280 × 144</text>

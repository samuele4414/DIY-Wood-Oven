<text x="605.2625" y="534" class="dim" text-anchor="middle">Traslazione 465,5</text>
<text x="45" y="605" class="small" text-anchor="start">1. Forno freddo, alimentazione isolata; sostenere il disco prima di disconnettere l&#x27;interfaccia superiore.</text>
<text x="45" y="640" class="small" text-anchor="start">2. Liberare ritegni e connettori; abbassare la cassetta di12 mm con un sostegno/guida protetto ancora da progettare.</text>
<text x="45" y="675" class="small" text-anchor="start">3. Sfilare dal fronte insieme allo schermo. Luce proposta280 × 144; margini residui verticali1 + 1 dopo riserva3 per bordo.</text>
<text x="45" y="710" class="small" text-anchor="start">4. Non possibile in quota: l&#x27;albero supera il passaggio. Nessuna estrazione dal basso sul piano fisso.</text>
<text x="45" y="760" class="small" text-anchor="start">Tolleranze, utensili, peso cassetta, raccordi, guide e cablaggi possono invalidare il percorso: porta di servizio NON congelata.</text>
</svg>
